# Claude review on pull requests -- meyng-hub/sango-audio-pipeline ONLY.
#
# WHY THIS REPO AND NOT meyng-hub/sangoai: the private repo carries 42
# unconsented audio blobs in master's ancestry and the admin-plane surface.
# An LLM-driven action with repo access does not belong there. The public
# pipeline repo is also the one an institutional host (Masakhane / UBC) will
# actually read -- which is the outcome this workflow exists to serve.
#
# WHY BEDROCK AND NOT AN ANTHROPIC API KEY: there is no Anthropic API key in
# this org. Bedrock is the programmatic path that already exists, already has
# cost alarms (SangoAI-Bedrock-HourlyCost-High) and already has route throttles.
#
# WHY SHA PINS AND NOT TAGS: a tag is mutable. Whoever controls the action repo
# can repoint it at new code, and that code runs with the permissions granted
# below. SHAs resolved 2026-08-09; tag recorded alongside for auditability.
# Re-pin deliberately, reading the diff -- not on a schedule.

name: Claude review

on:
  pull_request:
    types: [opened, synchronize]

# Least privilege. id-token:write is REQUIRED for OIDC (per
# anthropics/claude-code-action docs/cloud-providers.md). contents:read means
# the action cannot push. pull-requests:write is only so it can leave a review
# comment -- drop it if you would rather read the run log.
permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Forks cannot mint this repo's OIDC token, so a fork PR would fail
    # confusingly. Skip rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the review needs the diff base

      - name: Configure AWS credentials (OIDC -- no stored key)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Claude review
        uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1.0.189
        with:
          use_bedrock: "true"
          # CONFIRM BEFORE FIRST RUN: this must be a model the account has been
          # granted in us-east-1. Check with:
          #   aws bedrock list-inference-profiles --region us-east-1
          # The ID below is the one SangoAI's Lambdas already invoke (CLAUDE.md,
          # BEDROCK_MODEL_ID). The example in the action's own docs is a
          # different, likely stale ID -- do not copy it.
          claude_args: |
            --model us.anthropic.claude-sonnet-4-5-20250929-v1:0
          prompt: |
            Review this pull request for correctness and data-handling risk.

            This repository is a public Sango language-data pipeline. Weight
            these two above general code quality:
              1. Any change that could cause personal data, speaker audio, or
                 an unconsented recording to be committed or published.
              2. Any change to a CI gate that would make it unable to fail --
                 a gate that always passes is worse than no gate. If a check
                 is added or modified, state plainly whether a violating input
                 would actually fail it.

            Report findings with file and line. If you find nothing, say so
            plainly rather than manufacturing a finding.

# PREREQUISITE, verified 2026-08-09 by a real run of this workflow:
# A GitHub App IS required. The default GITHUB_TOKEN is not sufficient -- the
# action exits 1 with:
#     Claude Code is not installed on this repository.
#     Please install the Claude Code GitHub App at https://github.com/apps/claude
# Note this is a repository prerequisite, not a workflow input: there is nothing
# to add to this file. Install the app on THIS repo (github.com/apps/claude),
# then re-run. The alternative is bringing your own App -- create one, set
# APP_ID and APP_PRIVATE_KEY as repo secrets, and add an
# actions/create-github-app-token step before the review step, as shown in the
# action's docs/cloud-providers.md.
#
# Failure-mode triage for this workflow, from the two real failures seen:
#   "Not authorized to perform sts:AssumeRoleWithWebIdentity"
#       -> the IAM trust policy's sub condition does not match. GitHub emits
#          immutable numeric IDs in the claim
#          (repo:owner@<owner_id>/repo@<repo_id>:<context>), so a hand-built
#          "repo:owner/repo:*" never matches. AWS returns this same string for a
#          nonexistent role, so do not assume the role is missing.
#          Read the truth from:
#            gh api repos/<repo>/actions/oidc/customization/sub \
#              --jq .sub_claim_prefix
#   "AccessDenied" naming a region nobody configured
#       -> a cross-region ("us.") inference profile invokes member foundation
#          models in several regions; the IAM policy must cover all of them.
#          Resolve with: aws bedrock get-inference-profile --query models[].modelArn
