name: Secret Scan

# Fails when a change ADDS a credential-shaped value or filename (added lines only;
# history is not scanned). Make this a REQUIRED status check in branch protection,
# otherwise it blocks a merge only by being read.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: no credential added
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # Prove the gate can fail before trusting its verdict. Stdlib only.
      - name: Self-test
        run: python3 scripts/ci/secret-scan-gate.py --self-test

      - name: Scan added lines
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="origin/${BASE_REF}...HEAD"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..${SHA}"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "Scanning $RANGE"
          python3 scripts/ci/secret-scan-gate.py --range "$RANGE"
